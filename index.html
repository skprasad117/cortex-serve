<!doctype html>
<html lang="en" data-theme="neural">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a0f1f">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cortex</title>
<style>
:root{
  --bg:#f3f1ec;--card:#fcfbf8;--ink:#2b3036;--muted:#6a727c;--line:#e4e0d6;--soft:#ece9e1;
  --accent:#4f7c82;--accent-soft:#dfeaea;--ok:#5f8f6c;--ok-soft:#e1ede3;--warn:#b9822b;--warn-soft:#faf0d9;--bad:#b0605b;--bad-soft:#f6e3e0;
  --d-ai:#5b7fa6;--d-ml:#4f8f8a;--d-dl:#8a77b0;--d-nlp:#b27a8e;--d-genai:#c49a5a;--d-data-engineering:#7ea072;
  --d-software-dev:#7b8794;--d-architecture:#a08a6a;--d-quantum:#a671a8;--d-security:#b0705f;--d-other:#a3a8ae;
  --heat0:#e9e6dd;--heat1:#cfe0dc;--heat2:#a4c7c0;--heat3:#74a89f;--heat4:#4f8780;
  --shadow:0 1px 2px #0000000a,0 4px 14px #0000000a;
}
:root[data-theme="dark"]{
  --bg:#171c21;--card:#1f262d;--ink:#e3e7ea;--muted:#98a2ac;--line:#2d363f;--soft:#27303a;
  --accent:#86b6bb;--accent-soft:#25383b;--ok:#86b992;--ok-soft:#23332a;--warn:#e0b562;--warn-soft:#3a3223;--bad:#e08f88;--bad-soft:#3a2826;
  --heat0:#262f38;--heat1:#2b4443;--heat2:#376260;--heat3:#4b8581;--heat4:#79b8b1;--shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="neural"]){
    --bg:#171c21;--card:#1f262d;--ink:#e3e7ea;--muted:#98a2ac;--line:#2d363f;--soft:#27303a;
    --accent:#86b6bb;--accent-soft:#25383b;--ok:#86b992;--ok-soft:#23332a;--warn:#e0b562;--warn-soft:#3a3223;--bad:#e08f88;--bad-soft:#3a2826;
    --heat0:#262f38;--heat1:#2b4443;--heat2:#376260;--heat3:#4b8581;--heat4:#79b8b1;--shadow:none;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);flex:none}
.icon{background:var(--soft);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:18px}
.top h1{font-size:16px;margin:0;font-weight:650}
.top .sub{color:var(--muted);font-size:12px}
.top .grow{flex:1;min-width:0}
.top .grow>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding:16px;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
.view>.wrap{max-width:1180px;margin:0 auto}
.view h2{margin:0 0 2px;font-size:20px}
.view .hint{color:var(--muted);margin:0 0 14px;font-size:13px}

/* drawer */
#scrim{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(290px,84vw);background:var(--card);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;z-index:30;padding:16px 12px;padding-top:calc(16px + env(safe-area-inset-top));overflow:auto;box-shadow:var(--shadow);visibility:hidden}
#drawer.on{transform:none;visibility:visible}
#drawer h3{margin:0 8px 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#drawer a{display:flex;align-items:center;gap:10px;color:var(--ink);padding:10px;border-radius:10px;font-size:15px}
#drawer a:hover{background:var(--soft);text-decoration:none}
#drawer a.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
#drawer .badge{margin-left:auto;font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:0 8px}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}

/* cards & bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 8px;font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.card h3 .go{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.chip{display:inline-block;background:var(--soft);border-radius:99px;padding:1px 9px;font-size:12px;margin:0 4px 4px 0;border:1px solid transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
button.chip{border-color:var(--line)}button.chip.sel{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);font-style:italic}
.item{padding:8px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr))}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--heat0)}
.bar i{display:block}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;min-height:40px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input{flex:1;min-width:160px}
.s-stub{color:var(--warn)}.s-developing{color:var(--accent)}.s-solid{color:var(--ok)}
.due{color:var(--bad);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat div{aspect-ratio:1;border-radius:3px;background:var(--heat0);min-width:9px}
.progress{height:9px;border-radius:99px;background:var(--heat0);overflow:hidden;display:flex}
.progress i{display:block}
details summary{cursor:pointer}

/* home: fits the screen */
.view.home{padding:12px;overflow:hidden}
.homegrid{height:100%;display:grid;gap:10px;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto auto minmax(0,1fr) minmax(0,.8fr);max-width:1280px;margin:0 auto}
.hero{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px}
.hero .status{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft);flex:none}
.pulse.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.hero .when{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.tiles{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile b{display:block;font-size:26px;line-height:1.1}
.tile span{color:var(--muted);font-size:12px}
.tile.alert{background:var(--warn-soft);border-color:var(--warn)}.tile.alert b{color:var(--warn)}
.tile.good b{color:var(--ok)}
.panel{display:flex;flex-direction:column;min-height:0}
.panel .body{overflow:auto;min-height:0;flex:1}
.attn{grid-column:span 5;background:var(--warn-soft);border-color:var(--warn)}
.attn h3{color:var(--warn)}
.attn.clear{background:var(--ok-soft);border-color:var(--ok)}.attn.clear h3{color:var(--ok)}
.learn{grid-column:span 3}.doms{grid-column:span 4}
.recent{grid-column:span 5}.crs{grid-column:span 4}.hm{grid-column:span 3}
.arow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #00000014;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.arow:last-child{border-bottom:0}
.arow .tag{flex:none;font-size:11px;font-weight:700;background:var(--card);border-radius:6px;padding:1px 6px;color:var(--warn)}
.drow{display:grid;grid-template-columns:minmax(80px,1.3fr) 2fr 28px;gap:8px;align-items:center;padding:4px 2px;width:100%;background:none;border:0;text-align:left;font-size:13px}
.drow:hover{background:var(--soft);border-radius:6px}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .homegrid{grid-template-rows:auto auto minmax(0,1.3fr) minmax(0,1fr)}
  .attn{grid-column:1/-1}.learn{grid-column:span 6}.recent{grid-column:span 6}.doms,.crs,.hm{display:none}
  .tile:nth-child(n+4){display:none}
  .tile b{font-size:22px}
  .hero .status{font-size:15px}.hero .when{font-size:12px}
}
@media (max-width:520px){.learn,.recent{grid-column:1/-1}.learn{display:none}.homegrid{grid-template-rows:auto auto minmax(0,1.2fr) minmax(0,1fr)}}
@media (max-height:620px) and (min-width:901px){.tile b{font-size:20px}.tiles{gap:8px}}

/* graph */
.graphbox{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
@media (max-width:800px){.graphbox{grid-template-columns:1fr}}
#graph{width:100%;height:min(62vh,520px);border:1px solid var(--line);border-radius:12px;background:var(--card);touch-action:none}
#graph text{fill:var(--ink);font-size:10px;pointer-events:none}
#graph line{stroke:var(--line);stroke-width:1}
#graph line.hl{stroke:var(--accent);stroke-width:2}
#graph circle{stroke:var(--card);stroke-width:1.5;cursor:pointer}
#graph .dim{opacity:.15}
#tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:260px;font-size:12px;display:none;z-index:40;box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}


/* neural theme: "second brain" */
:root[data-theme="neural"]{
  --bg:#0a0f1f;--card:#111a33;--ink:#e7edff;--muted:#8f9bc0;--line:#243461;--soft:#18244a;
  --accent:#6ef0d2;--accent-soft:#12383f;--ok:#7be39b;--ok-soft:#13362a;--warn:#ffc46b;--warn-soft:#3b2d14;--bad:#ff8c9a;--bad-soft:#40202a;
  --d-ai:#7aa7ff;--d-ml:#5eead4;--d-dl:#b79bff;--d-nlp:#ff8fb8;--d-genai:#ffc46b;--d-data-engineering:#8be28d;
  --d-software-dev:#9fb0c9;--d-architecture:#d4b483;--d-quantum:#e58cff;--d-security:#ff9a85;--d-other:#8793b3;
  --heat0:#17224a;--heat1:#14507a;--heat2:#1b8aa0;--heat3:#32c9b0;--heat4:#8ff7de;--shadow:0 0 0 1px #6ef0d211,0 8px 28px #00000055;
}
#neural{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
.app{position:relative;z-index:1}
.logo{display:grid;place-items:center;width:34px;height:34px;color:var(--accent);flex:none}
.logo svg{width:30px;height:30px;overflow:visible}
.logo .node{fill:currentColor}
:root[data-theme="neural"] body{background:radial-gradient(1100px 700px at 12% -10%,#18286a 0%,transparent 60%),radial-gradient(900px 600px at 105% 105%,#0f3d4d 0%,transparent 55%),var(--bg)}
:root[data-theme="neural"] .top{background:#0a0f1fcc;backdrop-filter:blur(10px);border-bottom-color:#2a3c70}
:root[data-theme="neural"] .top h1{text-shadow:0 0 14px #6ef0d266}
:root[data-theme="neural"] .logo{filter:drop-shadow(0 0 6px #6ef0d2aa)}
:root[data-theme="neural"] .card,:root[data-theme="neural"] .tile{background:#111a33b3;backdrop-filter:blur(8px);border-color:#2a3c70}
:root[data-theme="neural"] .tile.alert,:root[data-theme="neural"] .attn{background:#3b2d14b8;border-color:#ffc46b88}
:root[data-theme="neural"] .attn.clear{background:#13362ab8;border-color:#7be39b88}
:root[data-theme="neural"] .tile:hover,:root[data-theme="neural"] button.card:hover{border-color:var(--accent);box-shadow:0 0 18px #6ef0d233}
:root[data-theme="neural"] #drawer{background:#0d1530f2;backdrop-filter:blur(12px)}
:root[data-theme="neural"] .pulse{box-shadow:0 0 0 4px #7be39b33,0 0 14px #7be39b}
:root[data-theme="neural"] .pulse.warn{box-shadow:0 0 0 4px #ffc46b33,0 0 14px #ffc46b}
:root[data-theme="neural"] .tile b{text-shadow:0 0 14px currentColor}
:root[data-theme="neural"] #graph{background:#0b1226cc}
:root[data-theme="neural"] #graph line{stroke:#6ef0d233}
:root[data-theme="neural"] #graph line.hl{stroke:var(--accent);filter:drop-shadow(0 0 4px var(--accent))}
:root[data-theme="neural"] #graph circle{stroke:#0b1226;filter:drop-shadow(0 0 6px currentColor)}
:root[data-theme="neural"] .heat div[style*="heat4"],:root[data-theme="neural"] .heat div[style*="heat3"]{box-shadow:0 0 6px var(--heat4)}

/* effects */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 4px var(--ok-soft)}50%{box-shadow:0 0 0 9px transparent}}
.rise{animation:rise .5s ease both}
.view.enter{animation:enter .22s ease both}
.card,.tile{transition:transform .18s ease,border-color .18s,box-shadow .18s}
@media (hover:hover){.tile:hover,.card.lift:hover,button.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0000001a}}
.tile:active,button.card:active,.arow:active{transform:scale(.985)}
.tile{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:var(--accent);opacity:.25;transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.pulse:not(.warn){animation:breathe 2.6s ease-in-out infinite}
.clearmark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:18px;animation:pop .5s ease both;margin-bottom:6px}
.heat div{transition:transform .12s}
@media (hover:hover){.heat div:hover{transform:scale(1.5);position:relative;z-index:2}}
.bar i,.progress i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.rowx{cursor:pointer}.rowx:hover td{background:var(--soft)}
td.detail{background:var(--soft);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* palette */
#palette{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:12vh 12px 0;background:#0007;z-index:50}
#palette.on{display:flex}
#palette .box{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px #0004;overflow:hidden;animation:pop .2s ease both}
#palette input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:16px;background:transparent}
#palette input:focus{outline:none}
#palette ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
#palette li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
#palette li.sel{background:var(--accent-soft)}
#palette li small{margin-left:auto;color:var(--muted)}
#palette .foot{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
kbd{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px}
/* focus timer */
#timerPop{position:fixed;top:calc(58px + env(safe-area-inset-top));right:12px;width:min(260px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow),0 12px 30px #0003;padding:14px;z-index:40;display:none;animation:pop .2s ease both}
#timerPop.on{display:block}
#timerPop .time{font-size:38px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
#timerPop .ring{height:6px;background:var(--heat0);border-radius:99px;overflow:hidden;margin:8px 0 12px}
#timerPop .ring i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s linear}
#timerPop .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.icon.run{background:var(--accent-soft);color:var(--accent);font-size:12px;width:auto;padding:0 10px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Cortex additions ===== */
#drawer .grp{margin:14px 8px 4px;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
#drawer .grp:first-child{margin-top:2px}
#drawer .grp::after{content:"";flex:1;height:1px;background:var(--line)}
#drawer{overflow:auto}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;background:var(--soft);margin:0 4px 4px 0}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.stale::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.pill.off::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bad)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2 .grow{flex:1}
.kv{display:grid;grid-template-columns:minmax(90px,.45fr) 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.tldr li{margin:3px 0}
.tldr{margin:0;padding-left:18px}
.cd{display:inline-block;min-width:74px;text-align:center;font-weight:650;border-radius:8px;padding:2px 8px;font-size:12px}
.cd.bad{background:var(--bad-soft);color:var(--bad)}.cd.warn{background:var(--warn-soft);color:var(--warn)}.cd.ok{background:var(--ok-soft);color:var(--ok)}.cd.mute{background:var(--soft);color:var(--muted)}
.evrow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.evrow:last-child{border:0}
.evrow .t{color:var(--accent);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
/* timeline */
.tl{position:relative;min-width:680px}
.tlwrap{overflow-x:auto;padding-bottom:4px}
.tl .ticks{position:relative;height:20px;border-bottom:1px solid var(--line)}
.tl .ticks span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .lanes{position:relative;margin-top:6px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/18 - 1px),var(--line) calc(100%/18 - 1px),var(--line) calc(100%/18))}
.tl .bar2{position:absolute;height:30px;border-radius:8px;padding:4px 8px;font-size:12px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);box-shadow:0 0 14px #6ef0d211}
.tl .bar2.office{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.tl .bar2.learn{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.tl .free{position:absolute;height:30px;border:1px dashed var(--accent);border-radius:8px;color:var(--muted);font-size:11px;padding:4px 8px;line-height:20px;white-space:nowrap;overflow:hidden;opacity:.75}
.tl .now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);box-shadow:0 0 10px var(--bad);z-index:2}

// Boot: if data.enc.json exists (deployed site) ask for the passphrase and decrypt in the browser;
// otherwise load the plain *.data.js files (local use / private repo).
(function () {
  const $ = id => document.getElementById(id);
  const FILES = ['ObsedianWiki/dashboard.data.js', 'daily-intelligence-learning-assistant/dailyrun.data.js'];
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = u => btoa(String.fromCharCode(...u));
  const inject = text => { const s = document.createElement('script'); s.textContent = text; document.body.append(s); };
  const startApp = () => inject($('app-src').textContent);
  const loadPlain = src => new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = () => r(true); s.onerror = () => r(false); document.body.append(s); });
  const decryptWith = async (key, box) => { const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(box.iv)}, key, b64(box.ct)); return JSON.parse(new TextDecoder().decode(pt)).files; };
  const unlock = files => { Object.values(files).forEach(inject); startApp(); };
  async function main() {
    let box = null;
    try { const r = await fetch('data.enc.json', {cache: 'no-cache'}); if (r.ok) box = await r.json(); } catch (e) {}
    if (!box) { await Promise.all(FILES.map(loadPlain)); return startApp(); }
    window.__CORTEX_ENC = true;
    try { const k = sessionStorage.getItem('cortex-key'); if (k) { const key = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', true, ['decrypt']); return unlock(await decryptWith(key, box)); } } catch (e) { try { sessionStorage.removeItem('cortex-key'); } catch (e2) {} }
    $('gate').hidden = false; $('gatePw').focus();
    $('gateForm').addEventListener('submit', async ev => {
      ev.preventDefault(); const btn = $('gateGo'), err = $('gateErr'); btn.disabled = true; err.textContent = 'Unlocking…'; err.style.color = 'var(--muted)';
      try {
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('gatePw').value), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(box.salt), iterations: box.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
        const files = await decryptWith(key, box);
        try { sessionStorage.setItem('cortex-key', b64e(new Uint8Array(await crypto.subtle.exportKey('raw', key)))); } catch (e) {}
        $('gate').hidden = true; $('gatePw').value = ''; unlock(files);
      } catch (e) { err.style.color = 'var(--bad)'; err.textContent = 'Wrong passphrase.'; btn.disabled = false; $('gatePw').select(); }
    });
  }
  main();
})();
</script>
<script type="text/plain" id="app-src">
// Cortex: one dashboard over two data files.
//   ObsedianWiki/dashboard.data.js                      -> window.DASHBOARD      (second-brain wiki)
//   daily-intelligence-learning-assistant/dailyrun.data.js -> window.DAILYRUN_DATA (daily briefings)
const arr = x => Array.isArray(x) ? x : [];
const EMPTY_WIKI = {generated: '', today: '', vault: 'Obsedian-Notes', domains: {}, pages: [], edges: [], by_type: {}, status_counts: {stub: 0, developing: 0, solid: 0}, questions: [], accidents: [], log: [], courses: [], quizzes: [], due: [], stubs: [], sources: [], raw_total: 0, raw_pending: [], activity: {}, domain_cards: [], health: {broken_links: [], orphans: [], missing_meta: [], contradictions: [], warnings: [], provisional: [], no_domain_tag: []}, reading: [], last_ingest: '', days_since_ingest: 0};
const HAS_WIKI = !!window.DASHBOARD, HAS_DAILY = !!(window.DAILYRUN_DATA && arr(window.DAILYRUN_DATA.runs).length);
const D = Object.assign({}, EMPTY_WIKI, window.DASHBOARD || {});
const RUNS = arr((window.DAILYRUN_DATA || {}).runs).slice().sort((a, b) => b.date.localeCompare(a.date));
const LATEST = RUNS[0] || null;
const S = (LATEST && LATEST.sections) || {};
const istToday = () => new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Kolkata'}).format(new Date());
const istMinutes = () => { const p = new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false}).format(new Date()).split(':'); return +p[0] * 60 + +p[1]; };
const TODAY = [istToday(), D.today, LATEST && LATEST.date].filter(Boolean).sort().pop();
const dayDiff = (a, b) => Math.round((new Date(a + 'T00:00:00Z') - new Date(b + 'T00:00:00Z')) / 864e5);
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const wday = d => WD[new Date(d + 'T00:00:00Z').getUTCDay()];
const countdown = d => { const n = dayDiff(d, TODAY); return n < 0 ? {t: 'Passed', c: 'mute', n} : n === 0 ? {t: 'Today', c: 'bad', n} : n === 1 ? {t: 'Tomorrow', c: 'bad', n} : {t: `In ${n} days`, c: n <= 3 ? 'warn' : 'ok', n}; };
const mins = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };

/* research -> wiki domain (inferred from keywords; the briefing data carries no domain field) */
const DOM_RULES = [
  ['quantum', /quantum|qubit|qec|logical error|error[- ]correction|cat-qubit|decoder|transversal|ion trap|superconduct/i],
  ['security', /security|cryptograph|vulnerab|exploit|jailbreak|malware|phishing/i],

  ['nlp', /\bllm\b|language model|tokeniz|context window|minimax|deepseek|gpt|claude|gemini|mistral|qwen|llama|flash\b/i],
  ['ml', /reinforcement|\brl\b|agent|policy gradient|benchmark/i],
  ['dl', /transformer|attention|neural|training|fine-tun|architecture/i],

const RESEARCH = [], _seen = new Set();
RUNS.forEach(r => ['ai', 'quantum'].forEach(kind => arr(r.sections && r.sections[kind]).forEach(it => {
  const key = it.link || it.title; if (_seen.has(key)) return; _seen.add(key);

})));

/* merged activity: wiki changes + research items per day */
const ACT = Object.assign({}, D.activity);
RESEARCH.forEach(r => { ACT[r.run] = (ACT[r.run] || 0) + 1; });

const $ = id => document.getElementById(id);

const link = p => el('a', {href: obs(p)}, p.name);
const byName = Object.fromEntries(D.pages.map(p => [p.name, p]));
const linkName = n => byName[n] ? link(byName[n]) : document.createTextNode(n);
const empty = t => el('div', {class: 'empty'}, t);
const go = id => { location.hash = id; };
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
const tipEl = () => $('tip');
const showTip = (e, text) => { const t = tipEl(); t.style.display = 'block'; t.style.left = Math.min(e.clientX + 12, innerWidth - 280) + 'px'; t.style.top = e.clientY + 12 + 'px'; t.textContent = text; };
const hideTip = () => { tipEl().style.display = 'none'; };
let toastTimer;
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1800); };
function countUp(node, n) {
  if (typeof n !== 'number' || reduced || n === 0) return node;
  const t0 = performance.now(), dur = 700; node.textContent = '0';
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); node.textContent = Math.round(n * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step); return node;
}
function ripple(e) {
  if (reduced) return; const b = e.currentTarget, r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
  const s = el('span', {class: 'ripple', style: `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`}); b.append(s); setTimeout(() => s.remove(), 600);
}
const openQ = D.questions.filter(q => q.status === 'OPEN');
const openA = D.accidents.filter(a => a.status === 'OPEN');
const dueNow = D.due.filter(p => p.review <= TODAY);
const sc = D.status_counts;
const H = D.health;
const healthIssues = H.broken_links.length + H.orphans.length + H.missing_meta.length + H.no_domain_tag.length;
const actToday = arr(S.actionItems);
const needs = openQ.length + openA.length + dueNow.length + D.raw_pending.length + actToday.length;
const wikiOnlyNeeds = openQ.length + openA.length + dueNow.length + D.raw_pending.length;

const root = document.documentElement;
try { const t = localStorage.getItem('cortex-theme'); if (t) root.dataset.theme = t; else root.dataset.theme = 'neural'; } catch (e) { root.dataset.theme = 'neural'; }
const THEMES = ['light', 'dark', 'neural'], THEME_NAMES = {light: 'Calm light', dark: 'Calm dark', neural: 'Neural'};
const effTheme = () => root.dataset.theme || 'neural';
$('themeBtn').onclick = () => {
  root.dataset.theme = THEMES[(THEMES.indexOf(effTheme()) + 1) % THEMES.length];
  try { localStorage.setItem('cortex-theme', root.dataset.theme); } catch (e) {}

if (window.__CORTEX_ENC) { $('lockBtn').hidden = false; $('lockBtn').onclick = () => { try { sessionStorage.removeItem('cortex-key'); } catch (e) {} location.reload(); }; }
$('gen').textContent = `Briefing ${LATEST ? LATEST.date : '–'} · Wiki ${D.generated || 'not loaded'}`;

const VIEWS = [
  ['home', '🏠', 'Overview', 'Cortex'], ['bridge', '🧬', 'Neural link', 'Cortex'],
  ['brief', '☀️', 'Daily briefing', 'Daily intelligence'], ['schedule', '📅', 'Schedule & deadlines', 'Daily intelligence'], ['inbox', '📬', 'Inbox intelligence', 'Daily intelligence'],

  ['attention', '🔔', 'Needs attention', 'Second brain'], ['map', '🕸️', 'Knowledge map', 'Second brain'], ['domains', '🧭', 'Domains', 'Second brain'],
  ['courses', '🎓', 'Courses', 'Second brain'], ['learning', '🧠', 'Learning & review', 'Second brain'], ['sources', '📚', 'Sources', 'Second brain'], ['activity', '📈', 'Activity', 'Second brain'],

}

    const dm = Math.hypot(n.x - mouse.x, n.y - mouse.y); if (dm < 150) { n.glow = Math.max(n.glow, 1 - dm / 150); if (step) { n.x += (mouse.x - n.x) * .004; n.y += (mouse.y - n.y) * .004; } }
  }

  }

  cx.shadowBlur = 0;
  if (step) {
    if (Math.random() < .05 && signals.length < 8) { const a = neurons[Math.floor(Math.random() * neurons.length)], near = neurons.filter(b => b !== a && Math.hypot(a.x - b.x, a.y - b.y) < LINK); if (near.length) signals.push({a, b: near[Math.floor(Math.random() * near.length)], t: 0}); }

  }

}
function nLoop() { if (!nOn) { nRaf = 0; return; } nDraw(true); nRaf = requestAnimationFrame(nLoop); }

document.addEventListener('visibilitychange', applyNeural);
applyNeural();

route();
